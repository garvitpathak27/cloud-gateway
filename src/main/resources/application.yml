spring:
  application:
    name: cloud-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          pool:
            type: elastic
            max-idle-time: 15s
            max-life-time: 60s
            eviction-interval: 10s
          loadbalancer:
            use404: false

          discovery:
            locator:
              enabled: false
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,X-Requested-With
                allow-credentials: false
                max-age: 3600
          routes:
            - id: auth-route
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
              metadata:
                response-timeout: 8000
                connect-timeout: 2000
              filters:
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    series: []
                    exceptions: java.io.IOException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 200ms
                      factor: 2
                      basedOnPreviousValue: false
            - id: chat-route
              uri: lb://chat-service
              predicates:
                - Path=/api/rooms/**
              filters:
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    series: []
                    exceptions: java.io.IOException
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 200ms
                      factor: 2
                      basedOnPreviousValue: false
          default-filters:
            - PreserveHostHeader
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - DedupeResponseHeader=Vary, RETAIN_UNIQUE 

    loadbalancer:
      cache:
        ttl: 5s
        capacity: 256

server:
  port: 8090
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read-only
  info:
    env:
      enabled: true

info:
  app:
    name: cloud-gateway
    description: Single public entry point for the chat platform


eureka:                                                                   
  client:                                                                 
    service-url:                                                          
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}            
    register-with-eureka: true   
    should-enforce-registration-at-init: false                                                                             
    fetch-registry: true                                                                                
    registry-fetch-interval-seconds: 5                                                                
    initial-instance-info-replication-interval-seconds: 5                 
    instance-info-replication-interval-seconds: 10 
    healthcheck:
      enabled: false
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    status-page-url-path: /actuator/info
    health-check-url-path: /actuator/health

logging:
  level:
    com.netflix.discovery.DiscoveryClient: DEBUG
    gateway.access: INFO
